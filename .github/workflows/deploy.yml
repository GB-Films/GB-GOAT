name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate types and Firebase rules
        run: npm run lint

      - name: Run domain tests
        run: npm test

      - name: Set up Java for Firestore permission tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-cli-15.22.1

      - name: Verify assigned area editing on imported projects
        run: npx --yes firebase-tools@15.22.1 emulators:exec --only firestore --project demo-goat-area-access "node tests/areaExpenseAccessRules.emulator.mjs"

      - name: Validate project integration functions
        run: |
          npm ci --prefix functions
          npm test --prefix functions

      - name: Verify shared supplier invoices, payments and private documents
        run: npx --yes firebase-tools@15.22.1 emulators:exec --only firestore,storage --project demo-goat-provider-finance "node tests/providerFinance.emulator.mjs"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          cp dist/index.html dist/404.html
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
